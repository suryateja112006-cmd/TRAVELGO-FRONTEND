<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Packages - TravelGo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        ✈️ Travel<span>Go</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="packages.html" class="active">Packages</a>
        <div id="navAuth" class="nav-auth">
          <a href="login.html" class="btn btn-outline btn-sm">Customer Login</a>
          <a href="register.html" class="btn btn-primary btn-sm">Register</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="section">
    <div class="container">
      <div class="section-header">
        <h2>Explore Travel Packages</h2>
        <p>Find the perfect package for your dream vacation across top destinations</p>
      </div>

      <div class="package-discovery-controls">
        <div class="filter-bar">
          <span aria-hidden="true">🔍</span>
          <input type="search" id="searchInput" placeholder="Search packages by destination or package name..." aria-label="Search travel packages">
        </div>
        <div class="package-filter-row" role="group" aria-label="Filter travel packages">
          <label class="package-filter-option"><input type="checkbox" id="budgetFriendlyFilter"> Under ₹10,000 / person</label>
          <label class="package-filter-option"><input type="checkbox" id="offersFilter"> Offers</label>
          <label class="package-filter-option"><input type="checkbox" id="familyFriendlyFilter"> Family-friendly</label>
          <label class="package-filter-option"><input type="checkbox" id="groupTripsFilter"> Group trips</label>
          <button type="button" id="clearPackageFilters" class="btn btn-outline btn-sm">Clear filters</button>
        </div>
        <p id="packageResultCount" class="package-result-count" role="status" aria-live="polite"></p>
      </div>

      <!-- Packages Grid Container -->
      <div id="packagesContainer" class="packages-grid">
        <div class="empty-state" style="grid-column: 1 / -1;">
          <h3>Loading Travel Packages...</h3>
          <p>Fetching package list from Spring Boot REST API...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-bottom" style="border: none; padding: 0;">
        <p>&copy; 2026 TravelGo Booking System. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/packages.js"></script>
</body>
</html>
